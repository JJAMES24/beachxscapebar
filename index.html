
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <meta name="theme-color" content="#101114">

  <meta name="description"
        content="Explore X-Cape Bar & Grill's menu and connect with us online.">

  <title>BEACH X-SCAPE Bar & Grill</title>

  <!-- Website favicon -->
  <link rel="icon" type="image/png"
        href="assets/logo.png">

 
  <link rel="stylesheet" href="style.css">

  <!-- Font Awesome Icons -->
  <link rel="preconnect"
        href="https://cdnjs.cloudflare.com"
        crossorigin>

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

  <!-- Background lettering -->
  <div class="background-word" aria-hidden="true">
    BEACH X-SCAPE BAR
  </div>

  <!-- Main website card -->
  <main class="link-card">

    <!-- LOGO -->
    <div class="logo-wrap">
      <img
        src="assets/logo.png"
        alt="X-Cape Bar & Grill logo"
        class="logo">
    </div>

    <!-- BUSINESS NAME -->
    <h1>
      BEACH X-SCAPE

    <p class="tagline">
      GOOD VIBES. GREAT TIMES.
    </p>

    <p class="intro">
      Explore our menu, follow the vibes,
      and stay connected with BEACH X-SCAPE.
    </p>


    <nav class="links" aria-label="Explore X-Cape">

      <!-- DRINKS MENU -->
      <a
        href="drinksmenu.html"
        class="link-button menu"
        target="_blank"
        rel="noopener noreferrer">

        <i class="fa-solid fa-martini-glass-citrus"
           aria-hidden="true"></i>

        <span>View Our Drinks Menu</span>

        <i class="fa-solid fa-arrow-right arrow"
           aria-hidden="true"></i>
      </a>

    <!--FOOD  MENU -->
      <a
        href="https://example.com/menu"
        class="link-button menu"
        target="_blank"
        rel="noopener noreferrer">

        <i class="fa-solid fa-utensils"
            aria-hidden="true"></i>

        <span>View Our Food Menu</span>

        <i class="fa-solid fa-arrow-right arrow"
           aria-hidden="true"></i>
      </a>

      <!-- INSTAGRAM -->
      <a
        href="https://www.instagram.com/beachxscapebar/"
        class="link-button instagram"
        target="_blank"
        rel="noopener noreferrer">

        <i class="fa-brands fa-instagram"
           aria-hidden="true"></i>

        <span>Instagram</span>

        <i class="fa-solid fa-arrow-right arrow"
           aria-hidden="true"></i>
      </a>

      <!-- FACEBOOK -->
      <!-- <a
        href="https://example.com/facebook"
        class="link-button facebook"
        target="_blank"
        rel="noopener noreferrer">

        <i class="fa-brands fa-facebook-f"
           aria-hidden="true"></i>

        <span>Facebook</span>

        <i class="fa-solid fa-arrow-right arrow"
           aria-hidden="true"></i>
      </a> -->

      <!-- TRIPADVISOR -->
      <!-- <a
        href="https://example.com/tripadvisor"

        <i class="fa-brands fa-tripadvisor"
           aria-hidden="true"></i>

        <span>Tripadvisor</span>

        <i class="fa-solid fa-arrow-right arrow"
           aria-hidden="true"></i>
      </a> -->

    </nav>

    <!-- LOCATION -->
    <footer>

      <p class="footer-heading">
        FIND YOUR X-SCAPE
      </p>

      <a
        class="location"
        href="https://maps.app.goo.gl/fZCFmr6rLrcD1CJj7"
        target="_blank"
        rel="noopener noreferrer">

        <i class="fa-solid fa-location-dot"
           aria-hidden="true"></i>

        <span>Morne Rouge, Grenada</span>
      </a>

      <p class="directions">
        Tap for directions
      </p>
